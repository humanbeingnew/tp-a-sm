<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ROBOTIS Premium Humanoid A-Type Simulator</title>
  <meta name="description" content="18-motor browser simulator for ROBOTIS Premium Humanoid A-Type">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">ROBOTIS · R+ MOTION WORKFLOW</div>
        <h1>Premium Humanoid A-Type Simulator</h1>
        <p class="sub">18개 DYNAMIXEL 위치값을 3D 휴머노이드 관절에 실시간으로 반영합니다.</p>
      </div>
      <div class="status"><span id="statusDot"></span><span id="statusText">READY</span></div>
    </header>

    <main class="layout">
      <section class="viewer panel">
        <div class="viewer-head">
          <div>
            <b>3D ROBOT</b>
            <span id="selectedJoint">선택된 모터 없음</span>
          </div>
          <div class="view-actions">
            <button id="frontBtn" type="button">정면</button>
            <button id="resetViewBtn" type="button">뷰 리셋</button>
          </div>
        </div>
        <div id="scene" aria-label="3D humanoid simulator"></div>
        <div class="viewer-foot">
          <span>드래그: 회전</span><span>휠: 줌</span><span>모터 행 클릭: 관절 선택</span>
        </div>
      </section>

      <aside class="controls">
        <section class="panel">
          <div class="section-head">
            <div><b>MOTOR CONTROL</b><small>AX-12+ · 0–1023</small></div>
            <button id="resetPoseBtn" class="primary" type="button">초기 자세</button>
          </div>
          <div id="motorList" class="motor-list"></div>
        </section>

        <section class="panel compact">
          <div class="section-head"><b>검증</b><span id="changedCount">0 / 18 변경</span></div>
          <div class="checks">
            <div><span>모터 연결</span><strong id="mappedCount">18 / 18</strong></div>
            <div><span>초기값</span><strong>ROBOTIS 기준</strong></div>
            <div><span>범위</span><strong>0–1023</strong></div>
          </div>
          <div id="message" class="message">모든 모터가 모델 관절에 연결되어 있습니다.</div>
        </section>

        <section class="panel compact">
          <div class="section-head"><b>현재 포즈</b><button id="copyValuesBtn" type="button">값 복사</button></div>
          <code id="poseOutput"></code>
        </section>
      </aside>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="js/robot.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
