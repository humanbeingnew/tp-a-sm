<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Humanoid A-Type Online Simulator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
.app{height:100vh;display:grid;grid-template-columns:280px minmax(0,1fr) 300px;grid-template-rows:56px 1fr}
header{grid-column:1/4;display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid #30363d;background:#11161d}
h1{font-size:16px;margin:0}.badge{font-size:11px;color:#8b949e;border:1px solid #30363d;border-radius:999px;padding:3px 7px}
.spacer{flex:1}button{font:inherit;background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:7px;padding:8px 10px;cursor:pointer}
button:hover{background:#30363d}.panel{background:#11161d;overflow:auto;padding:12px}.left{border-right:1px solid #30363d}.right{border-left:1px solid #30363d}
.stage{position:relative;min-width:0;min-height:0}.stage canvas{display:block;width:100%;height:100%}.status{position:absolute;left:12px;bottom:12px;background:#0d111dcc;border:1px solid #30363d;border-radius:7px;padding:8px 10px;font-size:11px}
.section{margin-bottom:18px}.section h2{font-size:12px;color:#8b949e;text-transform:uppercase;margin:0 0 9px}
.hint{font-size:12px;line-height:1.5;color:#8b949e}.motor{display:grid;grid-template-columns:32px 1fr 62px;gap:6px;align-items:center;margin:7px 0;font-size:12px}
.motor input[type=range]{width:100%}.motor input[type=number]{width:62px;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:5px;padding:4px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px;font-size:12px}.kv code{color:#79c0ff}.check{font-size:12px;margin:6px 0}.ok{color:#3fb950}.warn{color:#d29922}
.control{display:flex;gap:7px;align-items:center;margin:7px 0}.control label{font-size:12px;color:#8b949e}.control input{flex:1}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh;grid-template-columns:1fr;grid-template-rows:auto 55vh auto auto}header{grid-column:1}.left,.right{border:0;border-top:1px solid #30363d}.stage{min-height:55vh}}
</style>
</head>
<body>
<div class="app">
<header>
<h1>Humanoid A-Type Simulator</h1>
<span class="badge">Online</span><span class="badge">18 Motors</span>
<span class="spacer"></span>
<button id="reset">초기 자세</button>
<button id="homeView">정면</button>
</header>

<aside class="panel left">
<div class="section">
<h2>시뮬레이터</h2>
<p class="hint">타입 A의 18개 모터 Position 값을 조작하면서 3D 관절 움직임을 확인하는 온라인 테스트용 시뮬레이터입니다.</p>
</div>
<div class="section">
<h2>카메라</h2>
<div class="control"><label for="zoom">확대</label><input id="zoom" type="range" min="220" max="650" value="430"></div>
<div class="control"><label for="height">높이</label><input id="height" type="range" min="-30" max="80" value="0"></div>
</div>
<div class="section">
<h2>검증</h2>
<div id="checks"></div>
</div>
</aside>

<main class="stage">
<canvas id="view"></canvas>
<div class="status" id="status">시뮬레이터 준비됨</div>
</main>

<aside class="panel right">
<div class="section">
<h2>Motor Position</h2>
<div id="motors"></div>
</div>
</aside>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const INITIAL=[205,818,251,772,512,512,358,666,512,512,475,549,437,587,549,475,512,512];
const NAMES=[
"R shoulder pitch","L shoulder pitch","R shoulder roll","L shoulder roll",
"R elbow","L elbow","R hip yaw","L hip yaw","R hip roll","L hip roll",
"R hip pitch","L hip pitch","R knee","L knee","R ankle pitch","L ankle pitch",
"R ankle roll","L ankle roll"
];
const state={pose:[...INITIAL]};

const $=id=>document.getElementById(id);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0d1117);
const camera=new THREE.PerspectiveCamera(38,1,.1,1000);
camera.position.set(0,165,430); camera.lookAt(0,125,0);
const renderer=new THREE.WebGLRenderer({canvas:$("view"),antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));

scene.add(new THREE.HemisphereLight(0xffffff,0x202733,2));
const light=new THREE.DirectionalLight(0xffffff,2); light.position.set(120,240,180); scene.add(light);
const grid=new THREE.GridHelper(420,20,0x30363d,0x21262d); scene.add(grid);

const robot=new THREE.Group(); scene.add(robot);
const bodyMat=new THREE.MeshStandardMaterial({color:0x8b949e,roughness:.7,metalness:.25});
const jointMat=new THREE.MeshStandardMaterial({color:0x30363d,roughness:.8});
const joints={};

function box(w,h,d,mat=bodyMat){return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat)}
function joint(r,h){return new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16),jointMat)}
function limb(name,len,width,pos){
  const g=new THREE.Group(); g.position.set(pos[0],pos[1],pos[2]);
  const b=box(width,len,width); b.position.y=-len/2; g.add(b);
  const j=joint(width*.48,Math.max(8,width*.55)); g.add(j);
  robot.add(g); joints[name]=g; return g;
}

const torso=box(72,90,44); torso.position.y=175; robot.add(torso);
const neck=joint(10,12); neck.position.y=222; robot.add(neck);
const head=joint(18,28); head.position.y=244; robot.add(head);

const shoulderR=limb("armR",62,16,[43,197,0]);
const shoulderL=limb("armL",62,16,[-43,197,0]);
const foreR=new THREE.Group(); foreR.position.y=-62; shoulderR.add(foreR);
const foreL=new THREE.Group(); foreL.position.y=-62; shoulderL.add(foreL);
joints.foreR=foreR; joints.foreL=foreL;
const upperR=box(14,55,14); upperR.position.y=-27; foreR.add(upperR);
const upperL=box(14,55,14); upperL.position.y=-27; foreL.add(upperL);
const handR=box(16,25,18); handR.position.y=-58; foreR.add(handR);
const handL=box(16,25,18); handL.position.y=-58; foreL.add(handL);

const legR=limb("legR",70,18,[18,125,0]);
const legL=limb("legL",70,18,[-18,125,0]);
const footR=box(28,12,48); footR.position.set(18,45,9); robot.add(footR);
const footL=box(28,12,48); footL.position.set(-18,45,9); robot.add(footL);

function rad(v){return ((v-512)/1023)*Math.PI*2}
function applyPose(p){
  joints.armR.rotation.z=-rad(p[2])*.75;
  joints.armL.rotation.z= rad(p[3])*.75;
  joints.foreR.rotation.z=-rad(p[4])*.9;
  joints.foreL.rotation.z= rad(p[5])*.9;
  joints.legR.rotation.z=-rad(p[8])*.25;
  joints.legL.rotation.z= rad(p[9])*.25;
  joints.legR.rotation.x=-rad(p[10])*.18-rad(p[12])*.5;
  joints.legL.rotation.x=-rad(p[11])*.18-rad(p[13])*.5;
}

function renderMotors(){
  const root=$("motors"); root.replaceChildren();
  state.pose.forEach((value,i)=>{
    const row=document.createElement("div"); row.className="motor";
    const id=document.createElement("span"); id.textContent=String(i+1);
    const range=document.createElement("input"); range.type="range"; range.min="0"; range.max="1023"; range.value=String(value);
    const num=document.createElement("input"); num.type="number"; num.min="0"; num.max="1023"; num.step="1"; num.value=String(value); num.title=NAMES[i];
    const update=v=>{
      const n=Math.max(0,Math.min(1023,Number.isFinite(Number(v))?Math.round(Number(v)):512));
      state.pose[i]=n; range.value=String(n); num.value=String(n); applyPose(state.pose); runChecks();
    };
    range.addEventListener("input",()=>update(range.value));
    num.addEventListener("change",()=>update(num.value));
    row.append(id,range,num); root.append(row);
  });
}

function runChecks(){
  const valid=state.pose.length===18 && state.pose.every(v=>Number.isInteger(v)&&v>=0&&v<=1023);
  $("checks").innerHTML=
    '<div class="check ok">● 모터 채널: 18개</div>'+
    '<div class="check '+(valid?"ok":"warn")+'">● Position 범위: '+(valid?"통과":"확인 필요")+'</div>'+
    '<div class="check ok">● 3D 렌더링: 실행 중</div>'+
    '<div class="check warn">● 실제 로봇값: 조립 방향/오프셋 확인 필요</div>';
}

$("reset").addEventListener("click",()=>{
  state.pose=[...INITIAL]; applyPose(state.pose); renderMotors(); runChecks(); $("status").textContent="초기 자세로 복귀";
});
$("homeView").addEventListener("click",()=>{
  robot.rotation.set(0,0,0); camera.position.set(0,165,430); camera.lookAt(0,125,0); $("zoom").value="430"; $("height").value="0";
});
$("zoom").addEventListener("input",()=>{camera.position.z=Number($("zoom").value); camera.lookAt(0,125+Number($("height").value),0)});
$("height").addEventListener("input",()=>camera.lookAt(0,125+Number($("height").value),0));

let drag=null;
$("view").addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY}; $("view").setPointerCapture(e.pointerId)});
$("view").addEventListener("pointermove",e=>{
  if(!drag)return;
  robot.rotation.y+=(e.clientX-drag.x)*.008;
  robot.rotation.x=Math.max(-.35,Math.min(.35,robot.rotation.x+(e.clientY-drag.y)*.004));
  drag={x:e.clientX,y:e.clientY};
});
$("view").addEventListener("pointerup",()=>drag=null);
$("view").addEventListener("pointercancel",()=>drag=null);

function resize(){
  const r=$("view").getBoundingClientRect();
  renderer.setSize(Math.max(1,r.width),Math.max(1,r.height),false);
  camera.aspect=Math.max(.1,r.width)/Math.max(1,r.height);
  camera.updateProjectionMatrix();
}
window.addEventListener("resize",resize);
resize(); renderMotors(); applyPose(state.pose); runChecks();

function loop(){requestAnimationFrame(loop); renderer.render(scene,camera)}
loop();
</script>
</body>
</html>
