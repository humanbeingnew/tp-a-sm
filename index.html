<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROBOTIS Humanoid A-Type Simulator V4</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Humanoid A-Type Simulator <span>V4</span></h1>
      <p>ROBOTIS Premium Humanoid A-Type · 18 × AX-12+</p>
    </div>
    <div class="status" id="status">READY</div>
  </header>

  <main>
    <section class="stage-panel">
      <div class="toolbar">
        <button id="frontBtn">정면</button>
        <button id="resetBtn">초기 자세</button>
        <button id="centerBtn">전체 중앙값(512)</button>
        <button id="copyBtn">모터값 복사</button>
      </div>
      <canvas id="view" aria-label="3D Humanoid A-Type simulator"></canvas>
      <div class="legend">
        <span>드래그: 시점 회전</span><span>휠: 줌</span>
        <span id="poseReadout">Pose: A-Type Initial</span>
      </div>
    </section>

    <aside class="panel">
      <div class="panel-head">
        <div>
          <h2>Motor Position</h2>
          <p>AX-12+ · 0–1023 · center = 512</p>
        </div>
      </div>
      <div id="motors"></div>
      <div class="array-box">
        <label>현재 모터 배열</label>
        <code id="arrayOut"></code>
      </div>
      <div class="note">
        <b>중요:</b> 512는 모터의 전기적/수치상 중앙값이며, A-Type 초기 자세값과 다릅니다.
        초기 자세 버튼은 ROBOTIS A-Type의 <i>init</i> 값을 적용합니다.
      </div>
    </aside>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="js/robot.js"></script>
<script src="js/main.js"></script>
</body>
</html>
